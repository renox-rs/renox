# cargo-deny: checked in CI (`cargo deny check`). Renox is MIT OR Apache-2.0,
# so every dependency must allow use in both.

[graph]
all-features = true

[advisories]
# RustSec advisories fail the build; ignore one only with a reason.
#
# The Typst compiler (renox-pdf, #30) brings these. None is reachable from a
# render: the "unmaintained" ones are parsers and codecs Typst uses for
# bibliographies, syntax highlighting and its own font shaping, which a
# Renox template never feeds untrusted input; the two quick-xml ones are in
# citationberg, which reads CSL citation styles (Typst's `bibliography`),
# and citationberg pins quick-xml 0.38. Typst's `bibliography`, `cite` and
# `raw` are not part of the documents Renox makes (invoices, receipts), and
# the kit only passes the app's own templates and data to the compiler.
# Drop an entry when a Typst release moves off the crate.
ignore = [
    { id = "RUSTSEC-2026-0194", reason = "quick-xml 0.38 in citationberg (Typst bibliographies); no untrusted CSL" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml 0.38 in citationberg (Typst bibliographies); no untrusted CSL" },
    { id = "RUSTSEC-2025-0141", reason = "bincode in syntect (Typst syntax highlighting); only reads its own bundled data" },
    { id = "RUSTSEC-2024-0436", reason = "paste in hayagriva (Typst bibliographies); a compile-time macro" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz, Typst's text shaper; no maintained replacement in Typst yet" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser, Typst's font parser; fonts are the app's own" },
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml via serde_yaml in hayagriva (Typst bibliographies)" },
    { id = "RUSTSEC-2024-0320", reason = "yaml-rust in syntect (Typst syntax highlighting)" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "0BSD",
]
confidence-threshold = 0.9
# MPL-2.0 is copyleft per file: using these crates unmodified puts nothing on
# Renox or on apps. cssparser and its dtoa-short come with ammonia 4.1+, the
# HTML cleaner of renox-editors (#7).
exceptions = [
    { allow = ["MPL-2.0"], crate = "cssparser" },
    { allow = ["MPL-2.0"], crate = "dtoa-short" },
]

[licenses.private]
# The examples and test apps aren't published.
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
# TLS is rustls everywhere. aws-lc comes in only with the `s3` feature
# (object_store); the lint job checks a default build has none.
deny = [{ crate = "openssl-sys" }, { crate = "native-tls" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
