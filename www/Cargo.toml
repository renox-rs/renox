[package]
name = "renox-www"
version.workspace = true
edition = "2024"
publish = false
description = "renox.rs: Renox's landing page and blog, built with Renox."

[dependencies]
renox.workspace = true
# The docs site's code highlighter and its list of pages (for llms.txt).
renox-site = { path = "../site" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# The same Markdown parser renox-core uses for its `markdown` filter.
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
