[package]
name = "renox-editors"
description = "Rich text, Markdown and code editor fields, and a code entry, for Renox apps."
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["web", "framework", "editor", "markdown", "htmx"]
categories = ["web-programming::http-server", "text-editors"]

[dependencies]
renox.workspace = true
# Cleans the HTML a rich text editor sends (an allowlist of tags,
# attributes and URL schemes), so a user's markup can't run scripts.
# 4.1.7: the first 4.1 with the fixes for RUSTSEC-2021-0157/0158, which
# cover the whole 4.0 line since 2026-10-11 (#7). 4.1 brings cssparser
# (MPL-2.0, a cargo-deny exception in deny.toml) for `style` attributes,
# which this crate drops anyway.
ammonia = "~4.1.7"
serde = { version = "1.0.229", features = ["derive"] }
