[package]
name = "renox-oauth"
description = "Social login (Sign in with Google, GitHub, …) linked to the users of a Renox app."
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["web", "framework", "oauth", "social-login", "authentication"]
categories = ["web-programming::http-server", "authentication"]

[dependencies]
renox.workspace = true
# PKCE: the code challenge is the SHA-256 of the verifier, in unpadded
# base64url (RFC 7636). The versions renox-core uses.
sha2 = "0.11.0"
base64 = "0.23.1"
# The query string of the provider's authorization URL.
form_urlencoded = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
# A failed sign-in is logged for the operators (the visitor sees "try again").
tracing = "0.1.44"
