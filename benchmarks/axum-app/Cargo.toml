[package]
name = "bench-axum"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

# The floor: the crates Renox is built on, wired by hand with nothing else
# (no sessions, CSRF, security headers, request ids or error pages).
[dependencies]
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net"] }
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "runtime-tokio", "macros"] }
minijinja = { version = "2.24.0", features = ["loader"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
