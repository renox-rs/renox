# The benchmark apps: a workspace of their own (not the repo's), so they never
# slow down the repo's builds or CI. See README.md.
[workspace]
resolver = "3"
members = ["renox-app", "axum-app"]

[workspace.package]
edition = "2024"
publish = false

# What production builds use: full optimisation, one codegen unit, thin LTO.
[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
