{#- A person as their initials in a tinted circle (the shop shows no photos
    of people): `<app-avatar :name="user.name"/>`.
    The tint (teal, sand or terracotta) follows the name, so one person keeps
    one colour on every page. `size`: "s" (1.75rem), "m" (2.25rem) or "l"
    (3rem). Decorative: the name is always written beside it. -#}
<rx-props name size="m">
<span class="bs-avatar bs-avatar--{{ size }} bs-avatar--tone-{{ (name or '') | length % 3 }}" aria-hidden="true"><template rx-for="w in ((name or '?') | split)[:2]">{{ w[:1] | upper }}</template></span>
