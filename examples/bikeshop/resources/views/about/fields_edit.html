{#- `about.fields.edit`: the form of /about/fields with the stored values, each
    in the format its input expects (components/about_fields_form.html). -#}
<rx-page layout="layouts/app.html" title="{{ t('fields.edit_title', name=sample.name) }}">
  <rx-stack data-bs-reveal>
    <rx-page-header title="{{ t('fields.edit_title', name=sample.name) }}" subtitle="{{ t('fields.edit_lead') }}" back="{{ route('about.fields.show', sample.id) }}" back-label="{{ sample.name }}"/>
    <rx-card>
      <app-about-fields-form :sample="sample" :brands="brands" :price="price" :deposit="deposit" :deposit-currency="deposit_currency" :load="load" :load-unit="load_unit" :money-symbol="money_symbol" :money-step="money_step" :photo-url="photo_url"/>
    </rx-card>
  </rx-stack>
</rx-page>
