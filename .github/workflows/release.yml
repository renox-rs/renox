# Publishes the ten crates to crates.io and creates the GitHub release when a
# `v*` tag is pushed (RELEASING.md). No crates.io token is stored: crates.io's
# Trusted Publishing trusts this repository, this file and the `release`
# environment, and `crates-io-auth-action` swaps the job's OIDC token for a
# short-lived publish token.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Never two releases at once, and never cancel one halfway through publishing.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: publish to crates.io
    # Forks have the workflow but not the crates.
    if: github.repository == 'renox-rs/renox'
    runs-on: ubuntu-latest
    # Named in each crate's Trusted Publishing settings on crates.io; required
    # reviewers can be added to it in the repository settings.
    environment: release
    permissions:
      contents: write # the GitHub release
      id-token: write # the OIDC token crates.io trusts
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check the tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "renox") | .version')"
          if [ "$tag" != "v$version" ]; then
            echo "::error::Tag $tag doesn't match the workspace version $version (expected v$version)."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $tag points to a commit that isn't on main."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Builds and verifies every crate against the others of this release
      # before anything is uploaded, so a broken crate stops the release while
      # nothing is on crates.io yet. It also warms the target dir for the real
      # run, which has to finish within the token's 30 minutes.
      - name: Dry run
        run: cargo publish --workspace --dry-run

      - name: Get a crates.io token
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      # Cargo publishes the members in dependency order (renox-macros,
      # renox-core, renox, renox-cli, then the plugins) and waits until each is
      # in the index before the next.
      - name: Publish
        run: cargo publish --workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "The release $GITHUB_REF_NAME already exists; leaving it as it is."
            exit 0
          fi
          # The version's CHANGELOG section ("## 1.2.0 · 2026-11-01" up to the next "## ").
          awk -v head="## $VERSION " 'index($0, head) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }' CHANGELOG.md > notes.md
          flags=()
          case "$VERSION" in *-*) flags+=(--prerelease) ;; esac
          if [ -s notes.md ]; then
            flags+=(--notes-file notes.md)
          else
            echo "::warning::No '## $VERSION' section in CHANGELOG.md; using generated notes."
            flags+=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "Release $VERSION" "${flags[@]}"
