name: Release build (www)

# Builds renox.rs (renox-www: the landing page and the blog) on the same
# Ubuntu (glibc) as the production server. The server pulls the artifact with
# `gh run download`; CI holds no server keys. A new blog post is a new build.
on:
  push:
    branches: [main]
    paths:
      - "www/**"
      - "site/src/**"
      - "docs/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/release-www.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-www-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build renox-www (x86_64-linux, ubuntu-24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p renox-www
      - run: cargo build --release --locked -p renox-www
      - name: Package
        run: |
          mkdir dist
          cp target/release/renox-www dist/
          strip dist/renox-www
          echo "${GITHUB_SHA}" > dist/REVISION
          (cd dist && sha256sum renox-www > renox-www.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: renox-www-${{ github.sha }}
          path: dist/
          retention-days: 30
          if-no-files-found: error
