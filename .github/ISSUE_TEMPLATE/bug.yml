name: Bug
description: Renox, rnx or a generated app does something it shouldn't.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. A security problem? Don't open an issue: see
        [SECURITY.md](https://github.com/renox-rs/renox/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you did, what you saw (errors as text, not screenshots), and what you expected.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The smallest steps, e.g. `rnx new demo --starter`, then … A failing test is ideal.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: "`renox` in your Cargo.toml (a version or a git rev), and `rnx --version`."
      placeholder: renox 1.0.0, rnx 1.0.0
    validations:
      required: true
  - type: dropdown
    id: database
    attributes:
      label: Database
      options: [SQLite, PostgreSQL, Both, Not related]
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS and Rust version
      placeholder: Ubuntu 24.04, rustc 1.94
  - type: textarea
    id: where
    attributes:
      label: Where it might be (optional)
      description: A file and line, or a guess at the cause, if you looked.
