name: User story
description: Something an app author (or their users) should be able to do with Renox.
labels: ["story", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        One outcome per story. A large feature is an epic: open a story per part and link them
        as sub-issues.
  - type: textarea
    id: story
    attributes:
      label: Story
      description: Who wants what, and why.
      value: |
        As a …
        I want …
        so that …
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How we'll know it's done. Each line should become a test or a doc check.
      value: |
        - [ ] …
        - [ ] Documented (guide, CHEATSHEET.md, llms.txt) and shown in an example if it's a major feature
    validations:
      required: true
  - type: textarea
    id: laravel
    attributes:
      label: In Laravel (optional)
      description: How Laravel, Filament or another framework does it, if that's the yardstick.
  - type: textarea
    id: notes
    attributes:
      label: Notes (optional)
      description: API sketch, open questions, things it must not break (docs/stability.md).
